name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      # The suite never reaches the network and needs no credentials; live tests are
      # excluded by the `-m 'not live'` default in pyproject.toml. Coverage is enforced
      # rather than reported, so the README's coverage badge cannot silently go stale.
      - name: Run tests
        run: uv run pytest --cov=jueding --cov-report=term-missing --cov-fail-under=100

[project]
name = "jueding"
dynamic = ["version"]
description = "A typed Python wrapper for TypeSafe's Jev decision model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xiutian Cui" }]
keywords = ["decisions", "probability", "classification", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["typesafe-sdk>=0.7,<1"]

[project.urls]
Homepage = "https://github.com/xiutian-cui/jueding"
Issues = "https://github.com/xiutian-cui/jueding/issues"

# Dependency groups are development-only. They are never published and never
# reach anyone who installs jueding.
[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["pdoc>=16"]
dev = [{ include-group = "test" }, { include-group = "docs" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jueding/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jueding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = ["live: hits the real TypeSafe API; requires TYPESAFE_API_KEY"]

[tool.coverage.run]
source = ["jueding"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]
